<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | The Galactic Video Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- CSS VARIABLES & THEME --- */
        :root {
            --bg-base: #030308;
            --bg-surface: rgba(20, 20, 35, 0.6);
            --bg-surface-hover: rgba(30, 30, 50, 0.8);
            --accent-cyan: #00e5ff;
            --accent-cyan-glow: rgba(0, 229, 255, 0.4);
            --accent-purple: #9d00ff;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --border-color: rgba(255, 255, 255, 0.1);
            --sidebar-width: 240px;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(27, 0, 58, 0.5), transparent 25%), 
                radial-gradient(circle at 85% 30%, rgba(0, 17, 51, 0.5), transparent 25%);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            height: 100vh;
            overflow: hidden; /* Prevent body scroll, handle scroll in main area */
            display: flex;
        }

        /* Animated Stardust */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
            opacity: 0.2;
            z-index: -1;
            pointer-events: none;
            animation: drift 100s linear infinite;
        }

        @keyframes drift {
            from { background-position: 0 0; }
            to { background-position: -1000px 500px; }
        }

        /* --- LAYOUT --- */
        .sidebar {
            width: var(--sidebar-width);
            background: rgba(5, 5, 15, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            z-index: 100;
        }

        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .content-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px 40px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }

        /* --- SIDEBAR COMPONENTS --- */
        .brand {
            padding: 0 24px 30px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand h1 {
            margin: 0;
            color: var(--text-main);
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand span {
            color: var(--accent-cyan);
            text-shadow: 0 0 10px var(--accent-cyan-glow);
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 0 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.2s;
            font-weight: 600;
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .nav-item.active {
            background: rgba(0, 229, 255, 0.1);
            color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
        }

        .nav-item svg { width: 20px; height: 20px; }

        /* --- TOP HEADER --- */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(3, 3, 8, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 90;
        }

        .search-container {
            display: flex;
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 16px;
            transition: all 0.3s;
        }

        .search-container input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            background: rgba(0, 229, 255, 0.05);
            box-shadow: 0 0 15px var(--accent-cyan-glow);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-btn {
            position: absolute;
            right: 5px;
            top: 5px;
            bottom: 5px;
            padding: 0 20px;
            border-radius: 25px;
            border: none;
            background: var(--accent-cyan);
            color: #000;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px var(--accent-cyan-glow);
        }

        /* --- CATEGORY CHIPS (RECOMMENDED FILTER) --- */
        .categories-bar {
            display: flex;
            gap: 12px;
            padding: 20px 0;
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
        }
        .categories-bar::-webkit-scrollbar { display: none; }

        .chip {
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .chip:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .chip.active {
            background: var(--text-main);
            color: #000;
            border-color: var(--text-main);
        }

        /* --- VIDEO GRID --- */
        #videoContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            padding-bottom: 50px;
        }

        .video-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            cursor: pointer;
            group: card;
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .video-card:hover .thumbnail-wrapper {
            border-color: var(--accent-purple);
            box-shadow: 0 5px 20px rgba(157, 0, 255, 0.3);
            transform: translateY(-4px);
        }

        .thumbnail-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .video-card:hover .thumbnail-img {
            transform: scale(1.05);
        }

        .play-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .video-card:hover .play-overlay { opacity: 1; }

        .play-btn {
            width: 50px; height: 50px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--accent-cyan);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px var(--accent-cyan-glow);
            color: var(--accent-cyan);
            padding-left: 4px; /* Center the triangle */
        }

        .video-details {
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .channel-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff; font-size: 14px;
            flex-shrink: 0;
        }

        .video-text {
            display: flex; flex-direction: column; gap: 4px;
        }

        .video-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: var(--text-muted);
            background: var(--bg-surface);
            border-radius: 12px;
            border: 1px dashed var(--border-color);
        }

        /* --- MODAL (CINEMATIC VIEWER) --- */
        .modal {
            display: none;
            position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 5, 0.95);
            backdrop-filter: blur(15px);
            align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal.show { display: flex; opacity: 1; }
        .modal-wrapper { position: relative; width: 90%; max-width: 1100px; }
        
        .modal-content {
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 229, 255, 0.15);
            background: #000; overflow: hidden; width: 100%;
        }

        .iframe-container {
            position: relative; width: 100%; padding-bottom: 56.25%; height: 0;
        }
        .iframe-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

        .close-btn {
            position: absolute; top: -50px; right: 0;
            color: var(--text-muted); font-size: 40px; cursor: pointer; transition: all 0.2s;
        }
        .close-btn:hover { color: var(--accent-cyan); text-shadow: 0 0 10px var(--accent-cyan-glow); transform: scale(1.1); }

        /* Responsive */
        @media (max-width: 900px) {
            .sidebar { display: none; }
            .top-header { padding: 15px 20px; }
            .content-area { padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <!-- Left Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <h1><span>🚀</span> Nexus</h1>
        </div>
        <nav class="nav-links">
            <a class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                Home
            </a>
            <a class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
                Explore
            </a>
            <a class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path><polyline points="16 6 12 2 8 6"></polyline><line x1="12" y1="2" x2="12" y2="15"></line></svg>
                Transmissions
            </a>
            <a class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                Library
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="main-wrapper">
        <header class="top-header">
            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Search the cosmos...">
                <button class="search-btn" id="searchBtn">Engage</button>
            </div>
            <!-- Dummy User Avatar -->
            <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--border-color); border: 2px solid var(--accent-purple); cursor: pointer; overflow: hidden;">
                <img src="https://api.dicebear.com/7.x/bottts/svg?seed=NexusUser&backgroundColor=transparent" alt="User" style="width:100%; height:100%;">
            </div>
        </header>

        <div class="content-area">
            <!-- Filter / Category Chips -->
            <div class="categories-bar" id="categoriesBar">
                <!-- Javascript will populate these chips -->
            </div>

            <!-- Video Grid -->
            <main id="videoContainer">
                <div class="status-message">Initializing quantum uplink...</div>
            </main>
        </div>
    </div>

    <!-- Cinematic Video Modal -->
    <div id="videoModal" class="modal">
        <div class="modal-wrapper">
            <span class="close-btn" id="closeModal">&times;</span>
            <div class="modal-content iframe-container" id="modalIframeContainer">
                <!-- Iframe injected here via JS -->
            </div>
        </div>
    </div>

    <script>
        const API_KEY = 'AIzaSyBFTCtKzfMfpaj3aFjFPLbaysw5atwy_LA'; 
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const videoContainer = document.getElementById('videoContainer');
        const videoModal = document.getElementById('videoModal');
        const closeModal = document.getElementById('closeModal');
        const modalIframeContainer = document.getElementById('modalIframeContainer');
        const categoriesBar = document.getElementById('categoriesBar');

        // --- RECOMMENDATION & CATEGORY SYSTEM ---
        const categories = [
            { name: "All", query: "space documentaries 4k" },
            { name: "Recommended", query: "astrophysics OR universe secrets OR black holes documentary" }, // Curated "Recommended" query
            { name: "Black Holes", query: "black holes documentary" },
            { name: "James Webb", query: "james webb space telescope new images" },
            { name: "Nebulas", query: "beautiful nebulas space" },
            { name: "Mars Missions", query: "mars rover spacex" },
            { name: "Quantum Physics", query: "quantum physics explained" }
        ];

        let activeCategoryIndex = 0;

        function renderCategories() {
            categoriesBar.innerHTML = '';
            categories.forEach((cat, index) => {
                const btn = document.createElement('button');
                btn.className = `chip ${index === activeCategoryIndex ? 'active' : ''}`;
                btn.textContent = cat.name;
                btn.onclick = () => {
                    activeCategoryIndex = index;
                    renderCategories(); // Re-render to update 'active' class
                    searchInput.value = ''; // Clear search bar
                    fetchVideos(cat.query);
                };
                categoriesBar.appendChild(btn);
            });
        }

        // Initialize Categories
        renderCategories();

        // --- TIME FORMATTING ---
        // Converts "2023-10-15T..." to "3 months ago"
        function timeAgo(dateString) {
            const date = new Date(dateString);
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = Math.floor(seconds / 31536000);
            if (interval > 1) return interval + " years ago";
            interval = Math.floor(seconds / 2592000);
            if (interval > 1) return interval + " months ago";
            interval = Math.floor(seconds / 86400);
            if (interval > 1) return interval + " days ago";
            interval = Math.floor(seconds / 3600);
            if (interval > 1) return interval + " hours ago";
            return "Just now";
        }

        // Extract first letter for channel avatar
        function getChannelInitial(channelName) {
            return channelName ? channelName.charAt(0).toUpperCase() : '🛰️';
        }

        // --- FETCHING & RENDERING VIDEOS ---
        async function fetchVideos(query) {
            videoContainer.innerHTML = `
                <div class="status-message">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2" class="spin"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a10 10 0 0 1 10 10"></path></svg>
                    <p style="margin-top: 15px;">Scanning deep space sectors...</p>
                </div>
            `;
            // Quick inline CSS for the loading spinner
            if(!document.getElementById('spinStyle')) {
                document.head.insertAdjacentHTML('beforeend', '<style id="spinStyle">.spin { animation: spin 1s linear infinite; } @keyframes spin { 100% { transform: rotate(360deg); } }</style>');
            }

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=16&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);
                displayVideos(data.items);
            } catch (error) {
                console.error("Transmission error:", error);
                videoContainer.innerHTML = `<div class="status-message" style="color: #ff4444;">Error decoding transmission: ${error.message}</div>`;
            }
        }

        function displayVideos(videos) {
            videoContainer.innerHTML = '';
            
            if (!videos || videos.length === 0) {
                videoContainer.innerHTML = '<div class="status-message">No transmissions found in this sector. Try another frequency.</div>';
                return;
            }

            videos.forEach(video => {
                const videoId = video.id.videoId;
                const snippet = video.snippet;
                
                const card = document.createElement('div');
                card.className = 'video-card';
                
                card.innerHTML = `
                    <div class="thumbnail-wrapper">
                        <img class="thumbnail-img" src="${snippet.thumbnails.high.url}" alt="${snippet.title}">
                        <div class="play-overlay">
                            <div class="play-btn">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            </div>
                        </div>
                    </div>
                    <div class="video-details">
                        <div class="channel-avatar">${getChannelInitial(snippet.channelTitle)}</div>
                        <div class="video-text">
                            <h3 class="video-title" title="${snippet.title}">${snippet.title}</h3>
                            <p class="video-meta">${snippet.channelTitle}</p>
                            <p class="video-meta">${timeAgo(snippet.publishedAt)}</p>
                        </div>
                    </div>
                `;

                card.addEventListener('click', () => openModal(videoId, snippet.title));
                videoContainer.appendChild(card);
            });
        }

        // --- MODAL LOGIC ---
        function openModal(videoId, title) {
            modalIframeContainer.innerHTML = `
                <iframe 
                    src="https://www.youtube.com/embed/${videoId}?autoplay=1" 
                    title="${title}" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            `;
            videoModal.classList.add('show');
        }

        function closeVideoModal() {
            videoModal.classList.remove('show');
            modalIframeContainer.innerHTML = ''; 
        }

        closeModal.addEventListener('click', closeVideoModal);
        videoModal.addEventListener('click', (e) => {
            if (e.target === videoModal) closeVideoModal();
        });

        // --- SEARCH EVENT LISTENERS ---
        function triggerSearch() {
            const val = searchInput.value.trim();
            if (val) {
                // When manually searching, un-highlight category chips
                activeCategoryIndex = -1; 
                renderCategories();
                fetchVideos(val);
            }
        }

        searchBtn.addEventListener('click', triggerSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') triggerSearch();
        });

        // Start by loading the default category
        fetchVideos(categories[0].query);
    </script>

</body>
</html>
